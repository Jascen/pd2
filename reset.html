<style>
/* Layout: matches Pathing Compass. Sticky pill bar, then one sheet per act (8 character columns, cells span columns/rows); a cell greys out only when every character it covers is muted. */
:root{
  --bg:#f3f1ee; --panel:#fffdfa; --ink:#1d1a17; --muted:#6c645b; --line:#ddd6cc; --grid:#cfc6ba;
  --s:#b0302a; --p:#2f7a3b; --t:#b46a00; --b:#0b6f86; --g:#d6cec3; --w:#d6cec3;
  --alert:#b0302a; --link:#0b6f86;
  --mute:#c4beb6; --mute-ink:#55504a;
  --stone:#2b2722; --stone-ink:#e6dccb;
  --f-display:"Alegreya SC", Georgia, serif;
  --f-body:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121014; --panel:#1b181d; --ink:#ece6dc; --muted:#a39a8f; --line:#2f2a31; --grid:#3a343b;
  --s:#e2584f; --p:#5cb36a; --t:#e0a030; --b:#3fb4cf; --g:#3a343b; --w:#3a343b;
  --alert:#e2584f; --link:#3fb4cf;
  --mute:#0a090b; --mute-ink:#7a736b;
  --stone:#0b0a0c; --stone-ink:#d8cdbb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121014; --panel:#1b181d; --ink:#ece6dc; --muted:#a39a8f; --line:#2f2a31; --grid:#3a343b;
  --s:#e2584f; --p:#5cb36a; --t:#e0a030; --b:#3fb4cf; --g:#3a343b; --w:#3a343b;
  --alert:#e2584f; --link:#3fb4cf;
  --mute:#0a090b; --mute-ink:#7a736b;
  --stone:#0b0a0c; --stone-ink:#d8cdbb; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.32;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:70ch}
.sub b{color:var(--ink);font-weight:600}
.pill{font:600 14px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.pill:hover{border-color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.collapse .ct.dim,.collapse .hd.cls.dim{display:none}
.tomb.off{visibility:hidden}
.pill:focus-visible,.hd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.bar a{font-family:var(--f-display);font-weight:700;padding:4px 12px}
section{scroll-margin-top:60px;display:flex;flex-direction:column;gap:10px}
h2{font-family:var(--f-display);font-size:24px;margin:8px 0 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sheet{display:grid;grid-template-columns:repeat(8,minmax(112px,1fr));min-width:920px;position:relative;gap:4px;padding:4px}
.bg{border:2px solid var(--g);border-radius:5px;background:var(--panel);z-index:0}
.bg.s{border-color:var(--s)} .bg.p{border-color:var(--p)} .bg.t{border-color:var(--t)} .bg.b{border-color:var(--b)} .bg.g{border-color:var(--g)} .bg.w{border-color:var(--w)}
.bg.dim{background:var(--mute);border-color:var(--mute)}
.hd.k-s{color:var(--s)} .hd.k-p{color:var(--p)} .hd.k-t{color:var(--t)} .hd.k-b{color:var(--b)}
.ct{z-index:2;padding:5px 7px 7px;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.ct .h{font-weight:600;font-size:14.5px}
.ct .gap{height:10px}
.ct .i{font-style:italic}
.ct .al{font-weight:600;color:var(--alert)}
.ct .blue{color:var(--link);font-weight:600}
.ct.c{align-items:center;justify-content:center;text-align:center;font-weight:600;padding-block:10px;letter-spacing:.02em}
.ct.dim{color:var(--mute-ink)}
.ct.dim .al,.ct.dim .blue{color:var(--mute-ink)}
.ct.dim .h{text-decoration:line-through;text-decoration-thickness:1px}
.hd{z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 4px;user-select:none}
.hd.cls{font-style:italic;color:var(--muted);font-size:13px}
button.hd{font:600 14px var(--f-body);color:inherit;background:transparent;border:0;cursor:pointer}
button.hd[data-team]{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
button.hd:hover{text-decoration:underline}
button.hd[aria-pressed="true"]{text-decoration:line-through;color:var(--mute-ink)}
.hd.cls.dim{color:var(--mute-ink)}
.tombs{display:grid;grid-template-columns:repeat(8,minmax(112px,1fr));min-width:920px;background:var(--stone);gap:4px;padding:12px 4px}
.tomb{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--stone-ink);font-size:12px;text-align:center}
.tomb svg{width:44px;height:44px;max-width:100%}
.tomb svg *{stroke:var(--stone-ink);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tomb b{font-family:var(--f-mono);font-size:12px;font-weight:500}
footer{color:var(--muted);font-size:13px}
footer a{color:inherit}

</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.home{color:var(--muted);font-size:13px;text-decoration:none}.home:hover{color:var(--ink)}</style>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="blue">$1</span>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function lines(text){
  if(!text) return "";
  return text.split("|").map(l=>{
    if(l==="") return '<span class="gap"></span>';
    if(l.startsWith("- ")) return `<span>${inline(l)}</span>`;
    if(l.startsWith("!")) return `<span class="al">- !!! ${inline(l.slice(1))} !!!</span>`;
    if(l.startsWith("~")) return `<span class="h i">${inline(l.slice(1))}</span>`;
    if(l.startsWith("=")) return `<span>${inline(l.slice(1))}</span>`;
    return `<span class="h">${inline(l)}</span>`;
  }).join("");
}
const place = (c,span,r,rs) => `grid-column:${c} / span ${span};grid-row:${r} / span ${rs}`;
const HEAD = 4;

function sheet(act){
  const total = HEAD + act.rows;
  let h = "";
  // header: team row
  TEAMS.forEach((t,ti)=>{
    const c = t.cols[0]+1, span = t.cols.length;
    h += `<div class="bg ${t.c}" data-cols="${t.cols.join(",")}" style="${place(c,span,1,1)}"></div>`;
    h += `<button type="button" class="hd k-${t.c}" data-team="${ti}" style="${place(c,span,1,1)}" aria-pressed="false">${esc(t.name)}</button>`;
  });
  COLS.forEach((col,i)=>{
    const tc = TEAMS[col.team].c;
    h += `<div class="bg ${tc}" data-cols="${i}" style="${place(i+1,1,2,1)}"></div>`;
    h += `<button type="button" class="hd" data-col="${i}" style="${place(i+1,1,2,1)}" aria-pressed="false" title="Mute or unmute ${esc(col.name)}">${esc(col.name)}</button>`;
    h += `<div class="bg g" data-cols="${i}" style="${place(i+1,1,3,1)}"></div><div class="hd cls" data-cols="${i}" style="${place(i+1,1,3,1)}">${esc(col.cls)}</div>`;
    h += `<div class="bg g" data-cols="${i}" style="${place(i+1,1,4,1)}"></div><div class="hd cls" data-cols="${i}" style="${place(i+1,1,4,1)}">${esc(col.build)}</div>`;
  });
  act.cells.forEach(([c,span,r,rs,color,flags,text])=>{
    const p = place(c,span,r+HEAD,rs);
    const cols = Array.from({length:span},(_,k)=>c-1+k).join(",");
    h += `<div class="bg ${color}" data-cols="${cols}" style="${p}"></div>`;
    h += `<div class="ct${flags.includes("c")?" c":""}" data-cols="${cols}" style="${p}">${lines(text)}</div>`;
  });
  return `<div class="scroll">${act.tombs?tombStrip():""}<div class="sheet">${h}</div></div>`;
}
function tombStrip(){
  return `<div class="tombs" aria-label="Tal Rasha tomb symbols"><div></div>${TOMBS.map(([l,svg],i)=>
    `<div class="tomb" data-tcol="${i+1}"><svg viewBox="0 0 64 64" aria-hidden="true">${svg}</svg><b>${esc(l)}</b><span>${esc(COLS[i+1].name)}</span></div>`).join("")}</div>`;
}

document.getElementById("nav").innerHTML = ACTS.map(a=>`<a class="pill" href="#${a.id}">${a.n}</a>`).join("");
document.getElementById("acts").innerHTML = ACTS.map(a=>
  `<section id="${a.id}"><h2>${a.n}</h2>${sheet(a)}</section>`).join("");

// Muting
const KEY = "pd2-reset-muted";
let muted = new Set();
const CKEY = "pd2-reset-collapse";
let collapsed = false;
try{ collapsed = localStorage.getItem(CKEY) === "1"; }catch(e){}
try{ const m = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(m)) muted = new Set(m.filter(n=>n>=0&&n<8)); }catch(e){}
function apply(){
  document.querySelectorAll("[data-col]").forEach(el=>el.setAttribute("aria-pressed", muted.has(+el.dataset.col)));
  document.querySelectorAll("[data-team]").forEach(el=>{
    const all = TEAMS[+el.dataset.team].cols.every(c=>muted.has(c));
    el.setAttribute("aria-pressed", all);
  });
  document.querySelectorAll("[data-cols]").forEach(el=>{
    const cs = el.dataset.cols.split(",").map(Number);
    el.classList.toggle("dim", cs.every(c=>muted.has(c)));
  });
  // Collapse muted columns to a thin strip
  const shut = i => collapsed && muted.has(i);
  document.documentElement.classList.toggle("collapse", collapsed);
  document.getElementById("collapse").setAttribute("aria-pressed", collapsed);
  const tpl = COLS.map((_,i)=> shut(i) ? "28px" : "minmax(112px,1fr)").join(" ");
  const minW = COLS.reduce((w,_,i)=> w + (shut(i) ? 28 : 112), 0) + 7*4 + 8;
  document.querySelectorAll(".sheet,.tombs").forEach(el=>{ el.style.gridTemplateColumns = tpl; el.style.minWidth = minW + "px"; });
  document.querySelectorAll("[data-col]").forEach(el=>{ const i = +el.dataset.col; el.textContent = shut(i) ? COLS[i].name[0] : COLS[i].name; });
  document.querySelectorAll("[data-team]").forEach(el=>{
    const t = TEAMS[+el.dataset.team];
    el.textContent = t.cols.every(shut) ? t.name[0] : t.name;
  });
  document.querySelectorAll("[data-tcol]").forEach(el=> el.classList.toggle("off", shut(+el.dataset.tcol)));
  try{ localStorage.setItem(KEY, JSON.stringify([...muted])); localStorage.setItem(CKEY, collapsed ? "1" : "0"); }catch(e){}
}
document.addEventListener("click", e=>{
  const col = e.target.closest("[data-col]");
  const team = e.target.closest("[data-team]");
  if(col){ const i = +col.dataset.col; muted.has(i) ? muted.delete(i) : muted.add(i); apply(); }
  else if(team){
    const cs = TEAMS[+team.dataset.team].cols;
    const all = cs.every(c=>muted.has(c));
    cs.forEach(c=> all ? muted.delete(c) : muted.add(c)); apply();
  }
});
document.getElementById("unmute").addEventListener("click", ()=>{ muted.clear(); apply(); });
document.getElementById("collapse").addEventListener("click", ()=>{ collapsed = !collapsed; apply(); });
apply();

// Theme toggle (shares the setting with the other PD2 pages)
const root = document.documentElement, TKEY = "pd2-compass-theme";
const mq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : mq.matches;
const tbtn = document.getElementById("theme-btn");
const paint = () => { tbtn.textContent = isDark() ? "☀ Light" : "☾ Dark"; };
try{ const t = localStorage.getItem(TKEY); if(t === "dark" || t === "light") root.dataset.theme = t; }catch(e){}
paint(); mq.addEventListener && mq.addEventListener("change", paint);
tbtn.addEventListener("click", ()=>{ const n = isDark() ? "light" : "dark"; root.dataset.theme = n; try{ localStorage.setItem(TKEY, n); }catch(e){} paint(); });
</script>
</body>
</html>
